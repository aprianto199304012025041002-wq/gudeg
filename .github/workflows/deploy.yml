name: Deploy ke InfinityFree

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Buat config/.env dari secret
        run: |
          mkdir -p config
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_KEY=%s\n' \
            '${{ secrets.SUPABASE_URL }}' \
            '${{ secrets.SUPABASE_SERVICE_KEY }}' > config/.env

      - name: Buat keys/private.pem dari secret
        run: |
          mkdir -p keys
          printf '%s' '${{ secrets.RSA_PRIVATE_KEY }}' > keys/private.pem

      - name: Buat keys/public.pem dari secret
        run: |
          printf '%s' '${{ secrets.RSA_PUBLIC_KEY }}' > keys/public.pem

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.vs/**
            **/node_modules/**
            README.md
            .ftp-deploy-sync-state.json
