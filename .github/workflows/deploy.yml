name: Deploy ke InfinityFree

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Buat config/.env dari secret
        run: |
          mkdir -p htdocs/config
          cat > htdocs/config/.env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          EOF

      - name: Buat keys/private.pem dari secret
        run: |
          mkdir -p htdocs/keys
          echo "${{ secrets.RSA_PRIVATE_KEY }}" > htdocs/keys/private.pem

      - name: Buat keys/public.pem dari secret
        run: |
          echo "${{ secrets.RSA_PUBLIC_KEY }}" > htdocs/keys/public.pem

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./htdocs/
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**