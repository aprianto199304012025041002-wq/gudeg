name: Query Supabase

on:
  workflow_dispatch:
    inputs:
      table:
        description: 'Nama tabel (contoh: users, sessions, apps)'
        required: false
        default: 'users'
      select:
        description: 'Kolom yang dipilih'
        required: false
        default: '*'
      limit:
        description: 'Limit rows'
        required: false
        default: '20'

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Query semua tabel
        run: |
          mkdir -p query-results
          BASE="https://nscgcspkotpghgmgbwyb.supabase.co/rest/v1"
          KEY="${{ secrets.SUPABASE_KEY }}"

          for tabel in users sessions sso_applications user_applications user_logs admin_logs token_blacklist; do
            curl -s "${BASE}/${tabel}?select=*&limit=100" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}" \
              > "query-results/${tabel}.json"
            echo "=== ${tabel} ==="
            cat "query-results/${tabel}.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'  {len(d)} rows')" 2>/dev/null || echo "  error"
          done

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > query-results/timestamp.txt

      - name: Commit result
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add query-results/
          git diff --staged --quiet && echo "No changes" || git commit -m "query all tables $(date -u +%Y%m%d-%H%M%S)"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/aprianto199304012025041002-wq/gudeg.git HEAD:master
