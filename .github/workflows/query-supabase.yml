name: Query Supabase

on:
  workflow_dispatch:
    inputs:
      table:
        description: 'Nama tabel (contoh: users, sessions, apps)'
        required: false
        default: 'users'
      select:
        description: 'Kolom yang dipilih'
        required: false
        default: '*'
      limit:
        description: 'Limit rows'
        required: false
        default: '20'
      offset:
        description: 'Offset (skip rows)'
        required: false
        default: '0'
      order:
        description: 'Order (contoh: id.desc atau created_at.desc)'
        required: false
        default: 'id.desc'

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Query Supabase
        run: |
          mkdir -p query-results
          BASE="https://nscgcspkotpghgmgbwyb.supabase.co/rest/v1"
          KEY="${{ secrets.SUPABASE_KEY }}"

          # Query tabel yang diminta
          curl -s \
            "${BASE}/${{ github.event.inputs.table }}?select=${{ github.event.inputs.select }}&limit=${{ github.event.inputs.limit }}&offset=${{ github.event.inputs.offset }}&order=${{ github.event.inputs.order }}" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            > "query-results/result.json"

          # Selalu refresh sessions dan user_logs untuk verifikasi
          curl -s "${BASE}/sessions?select=id,user_id,last_activity,ip_address&limit=100" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
            > "query-results/sessions.json"

          curl -s "${BASE}/user_logs?select=id,user_id,activity,created_at&limit=50&order=id.desc" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
            > "query-results/user_logs.json"

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > query-results/timestamp.txt

      - name: Commit result
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add query-results/
          git diff --staged --quiet && echo "No changes" || git commit -m "query result $(date -u +%Y%m%d-%H%M%S)"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/aprianto199304012025041002-wq/gudeg.git HEAD:master
