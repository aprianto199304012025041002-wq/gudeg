name: Query Supabase

on:
  workflow_dispatch:
    inputs:
      table:
        description: 'Nama tabel (contoh: users, sessions, apps)'
        required: false
        default: 'users'
      select:
        description: 'Kolom yang dipilih'
        required: false
        default: '*'
      limit:
        description: 'Limit rows'
        required: false
        default: '20'
      offset:
        description: 'Offset (skip rows)'
        required: false
        default: '0'
      order:
        description: 'Order (contoh: id.desc atau created_at.desc)'
        required: false
        default: 'id.desc'

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Query Supabase
        env:
          # SUPABASE_URL disimpan di GitHub Secrets — jangan hardcode URL di sini (#91)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          BASE="${SUPABASE_URL}/rest/v1"
          KEY="${SUPABASE_SERVICE_KEY}"

          # Query tabel yang diminta — output ke stdout saja, tidak di-commit (#93)
          echo "=== Query result ==="
          curl -sf \
            "${BASE}/${{ github.event.inputs.table }}?select=${{ github.event.inputs.select }}&limit=${{ github.event.inputs.limit }}&offset=${{ github.event.inputs.offset }}&order=${{ github.event.inputs.order }}" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" | python3 -m json.tool || echo "(kosong atau error)"

          echo "=== sessions (last 10) ==="
          curl -sf "${BASE}/sessions?select=id,user_id,last_activity,ip_address&limit=10&order=last_activity.desc" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" | python3 -m json.tool || echo "(kosong atau error)"

          echo "=== user_logs (last 10) ==="
          curl -sf "${BASE}/user_logs?select=id,user_id,activity,created_at&limit=10&order=id.desc" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" | python3 -m json.tool || echo "(kosong atau error)"

      # Step "Commit result" dihapus (#93) — data query tidak boleh masuk ke git history.
      # Hasil query bisa dilihat di tab "Actions" → run ini → log step "Query Supabase".
